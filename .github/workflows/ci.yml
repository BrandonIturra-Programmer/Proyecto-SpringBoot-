name: CI

on:
  push:
  pull_request:

jobs:
  build-y-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api-blank

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      
      - name: Compilar y correr tests
        run: mvn -B verify