spring.application.name=api-blank

# Base de datos (variables de entorno, con valores por defecto para local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/api_blank}
spring.datasource.username=${DB_USER:api_user}
spring.datasource.password=${DB_PASSWORD:api_pass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-local-cambiar-en-produccion-123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}